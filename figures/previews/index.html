<h1>生信绘图模板：真实来源预览</h1><p>全部来自冻结PFOS源表；跨背景程序、条件背景校准、共享坐标三类示例来自新整合分析dry-run。这里验证绘图接口，不代表上游论文复现或新增生物学结论。一个项目同一类图固定一个变体。<a href='../README.md'>使用说明</a></p>
<figure id='r_violin'><h2>无轮廓小提琴：中位数与四分位摘要</h2><img src='r_violin/figure.png' alt='无轮廓小提琴：中位数与四分位摘要'><figcaption><p>生物学意义：比较甲基化方向及区域类别对应的RNA效应分布。</p><p>数据分布特征：冻结3173行；填色透明度0.30，无轮廓或箱体；点为中位数，0.25mm线为Q1–Q3。</p><p>最终结论：描述基因层分布；四分位线不是置信区间或动物级检验。</p><a href='r_violin/figure.pdf'>原生PDF</a> · <a href='r_violin/figure.json'>执行回执</a></figcaption></figure>
<figure id='python_volcano'><h2>代谢特征效应与统计分布</h2><img src='python_volcano/figure.png' alt='代谢特征效应与统计分布'><figcaption><p>生物学意义：沿用已冻结代谢特征分类，观察效应与统计支持。</p><p>数据分布特征：26,359特征全部显示；方向用蓝粉、not_sig灰，robust圆形、exploratory三角；P与BH来自原模型。</p><p>最终结论：未知身份仍称代谢特征；不新增统计检验。</p><a href='python_volcano/figure.pdf'>原生PDF</a> · <a href='python_volcano/figure.json'>执行回执</a></figcaption></figure>

<figure id='python_composition'><h2>捕获细胞组成</h2><img src='python_composition/figure.png' alt='捕获细胞组成'><figcaption><p>生物学意义：检查各文库捕获的细胞类型分布。</p><p>数据分布特征：实际14个library×celltype比例；类别固定，完整组成网格不补零。</p><p>最终结论：捕获组成不是动物级组织丰度。</p><a href='python_composition/figure.pdf'>原生PDF</a> · <a href='python_composition/figure.json'>执行回执</a></figcaption></figure>
<figure id='python_program_nes'><h2>跨背景排序程序矩阵</h2><img src='python_program_nes/figure.png' alt='跨背景排序程序矩阵'><figcaption><p>生物学意义：对齐七背景、三个基因集集合的既有排序富集方向。</p><p>数据分布特征：实际PFOS整合dry-run：完整9777行保留；每集合按跨context最小既有BH取10 pathways、全部contexts；NES±3，圈示族内BH&lt;0.05。</p><p>最终结论：显示子集不代表全局无偏发现；不同背景独立估计，无跨阶段同一动物配对。</p><a href='python_program_nes/figure.pdf'>原生PDF</a> · <a href='python_program_nes/figure.json'>执行回执</a></figcaption></figure>
<figure id='python_calibration'><h2>完整测试背景的分层置换校准</h2><img src='python_calibration/figure.png' alt='完整测试背景的分层置换校准'><figcaption><p>生物学意义：将三类观察重叠放到条件背景零分布中评估。</p><p>数据分布特征：实际PFOS整合dry-run冻结30000条null、3项既有经验P与B=10000；不重算置换或P。</p><p>最终结论：校准现有背景偏倚，不证明跨组学调控或因果。</p><a href='python_calibration/figure.pdf'>原生PDF</a> · <a href='python_calibration/figure.json'>执行回执</a></figcaption></figure>
<figure id='python_locus'><h2>候选位点共享坐标多轨</h2><img src='python_locus/figure.png' alt='候选位点共享坐标多轨'><figcaption><p>生物学意义：核对RNA、ATAC和WGBS是否确实在同一坐标邻域提供证据。</p><p>数据分布特征：实际PFOS整合dry-run17条、5候选；共享GRCm39坐标，图上逐条保留本层效应单位。</p><p>最终结论：selected evidence，未检验层与零效应不混同；不是样本配对或因果轨迹。</p><a href='python_locus/figure.pdf'>原生PDF</a> · <a href='python_locus/figure.json'>执行回执</a></figcaption></figure></html>

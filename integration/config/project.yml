title: 联合分析：填写课题与真实输入
species: mouse
genome: GRCm39
reference: CONTROL
comparison: TREATMENT
p_cutoff: 0.05
fdr_cutoff: 0.05
lfc_cutoff: 0.58
orgdb: org.Mm.eg.db
liver_inputs:
- rna_liver
- atac_liver
- wgbs_liver
- metabolomics_liver
inputs:
- id: rna_liver
  kind: rna
  context: liver
  path: INPUT_REQUIRED/rna_liver.csv
  species: mouse
  genome: GRCm39
  source_status: USER_REQUIRED
  biological_unit: unknown
  pairing: unknown
  quality: USER_REQUIRED
  required_columns:
  - gene_id
  - ensembl_id
  - SYMBOL
  - log2FoldChange
  - pvalue
  - padj
  - sampleA
  - sampleB
  expression: INPUT_REQUIRED/rna_liver_normalized_expression.tsv
  samples: INPUT_REQUIRED/rna_liver_samples.tsv
- id: wgbs_liver
  kind: wgbs
  context: liver
  path: INPUT_REQUIRED/wgbs_liver.csv
  species: mouse
  genome: GRCm39
  source_status: USER_REQUIRED
  biological_unit: unknown
  pairing: unknown
  quality: USER_REQUIRED
  gene_column: gene_id_clean
  effect_column: diffMethy
  region_column: DMR_id
  required_columns:
  - gene_id_clean
  - DMR_id
  - seqnames
  - start
  - end
  - diffMethy
  - annotation
  - group1_label
  - group2_label
  - meanMethy_group1
  - meanMethy_group2
  cpg_rdata: INPUT_REQUIRED/wgbs_liver_CpG.RData
  samples: INPUT_REQUIRED/wgbs_liver_reads_info.txt
  sample_methylation: INPUT_REQUIRED/wgbs_liver_dmr_region_sample_support.csv
  tracks:
    CONTROL:
    - INPUT_REQUIRED/wgbs_liver_CONTROL_methylation.bw
    TREATMENT:
    - INPUT_REQUIRED/wgbs_liver_TREATMENT_methylation.bw
- id: atac_liver
  kind: atac
  context: liver
  path: INPUT_REQUIRED/atac_liver.csv
  species: mouse
  genome: GRCm39
  source_status: USER_REQUIRED
  biological_unit: unknown
  pairing: unknown
  quality: USER_REQUIRED
  gene_column: ENSEMBL
  effect_column: Fold
  region_column: peak_id
  required_columns:
  - ENSEMBL
  - Fold
  - FDR
  - pvalue
  - peak_id
  - seqnames
  - start
  - end
  - annotation
  - Direction
  all_sites: INPUT_REQUIRED/Differential_Peaks_AllSites.csv
  universe: INPUT_REQUIRED/Background_Peak_Associated_Genes.csv
- id: metabolomics_liver
  kind: metabolomics
  context: liver
  path: INPUT_REQUIRED/metabolomics_liver.csv
  species: mouse
  genome: GRCm39
  source_status: USER_REQUIRED
  biological_unit: unknown
  pairing: unknown
  quality: USER_REQUIRED
  required_columns:
  - feature_id
  - log2FC
  - limma_p
  - fdr
  - classification
  - direction
  - confidence_level
  - annotation_match_type
  - annotation_ambiguous
- id: islet_celltypes
  kind: celltypes
  context: islet
  path: INPUT_REQUIRED/islet_celltypes.tsv
  species: mouse
  genome: GRCm39
  source_status: USER_REQUIRED
  biological_unit: unknown
  pairing: unknown
  quality: USER_REQUIRED
  required_columns:
  - library_id
  - condition
  - cell_type
  - gene
  - count
  - cells
- id: metabolic_pathway_effects
  kind: metabolic_pathways
  context: liver
  path: INPUT_REQUIRED/metabolic_pathway_effects.tsv
  species: mouse
  genome: GRCm39
  source_status: USER_REQUIRED
  biological_unit: unknown
  pairing: unknown
  quality: USER_REQUIRED
  required_columns:
  - pathway
  - log2FC
  - p
  - fdr
gene_sets: INPUT_REQUIRED/mouse_native_gene_sets.rds
figure_profile: ../shared/figure_style.json
deepening:
  seed: 1
  permutations: 10000
  program_collections:
  - Mouse_MH
  - Mouse_KEGG
  - Mouse_Reactome
  posttranscriptional:
    selected_samples: INPUT_REQUIRED/{context}/plot_samples.tsv
    das_metadata: INPUT_REQUIRED/{context}/rmats_run_metadata.tsv
    deu_metadata: INPUT_REQUIRED/{context}/deu_sample_manifest.tsv
    apa_metadata: INPUT_REQUIRED/{context}/apa_sample_manifest.tsv
    der_metadata: INPUT_REQUIRED/{context}/der_sample_manifest.tsv
    is_metadata: INPUT_REQUIRED/{context}/isoform_switch_sample_manifest.tsv
    selected_de: INPUT_REQUIRED/{context}/selected_DE_results.csv
    integrated_evidence: INPUT_REQUIRED/{context}/splicing_gene_evidence.csv
    das_events: INPUT_REQUIRED/{context}/rmats_all_events.csv
    deu_gene_tests: INPUT_REQUIRED/{context}/diffsplice_gene_simes.csv
    apa_events: INPUT_REQUIRED/{context}/apa_all_events.csv
    isoform_selected: INPUT_REQUIRED/{context}/significant_switch_genes.csv
    der_regions: INPUT_REQUIRED/{context}/all_DERs.csv
    der_gene_evidence: INPUT_REQUIRED/{context}/DER_gene_evidence.csv
rna_context_order:
- liver
embryo_contexts: []
rna_gene_panel: []
cross_wgbs_pairs: []
joint_inputs:
  gtf: INPUT_REQUIRED/genome.gtf
  txdb: INPUT_REQUIRED/genome.sqlite
  cgi: INPUT_REQUIRED/cpg_islands.tsv.gz
joint_rna_context:
  liver: liver

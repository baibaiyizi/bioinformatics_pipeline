[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-ml-pipeline"
version = "0.1.0"
description = "Leakage-resistant nested-validation pipeline for frozen scientific feature tables"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.7,<1.9",
]

[project.optional-dependencies]
explain = ["shap>=0.48,<1"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

project_id: vina_1iep_imatinib_abl1
receptor:
  input_pdb: ../benchmark/1iep/1iep_holo.pdb
  source:
    database: RCSB_PDB
    id: 1IEP
  protein_chains: [A]
  covalent_ligand: false
  protonation_method: reduce_hbond_network
  structure_review_decision: terminal missing residues 223-224 and 499-515 are outside the co-crystal pocket; accepted for capability benchmark only
pocket:
  basis: co_crystal_ligand
  native_ligand_resname: STI
  native_reference_sdf: ../benchmark/1iep/native_imatinib.sdf
  center: [15.190, 53.903, 16.917]
  size: [20.0, 20.0, 20.0]
ligand_table: ../benchmark/1iep/ligands.tsv
output_dir: ../result/1iep_modeling
docking:
  engine: vina
  seeds: [101, 202, 303]
  exhaustiveness: 32
  num_modes: 20
  require_posebusters: true
  redocking:
    enabled: true
    rmsd_threshold_angstrom: 2.0
    minimum_passing_seeds: 2
md:
  engine: gromacs
  ligand_id: native_imatinib
  replicas: 3
  seeds: [1001, 1002, 1003]
  parameterization:
    protein_forcefield: ff14SB
    ligand_forcefield: GAFF2
    charge_method: AM1-BCC
    water_model: TIP3P
  smoke:
    steps: 500
  production:
    enabled: false
analysis:
  ligand_selection: resname LIG
  contact_cutoff_angstrom: 4.5
  key_distances: []

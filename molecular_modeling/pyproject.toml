[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-molecular-modeling"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["MDAnalysis>=2.10,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "parmed>=4,<5", "pyyaml>=6,<7", "rdkit>=2025.3,<2027"]

[project.optional-dependencies]
docking = ["vina>=1.2.7,<2", "meeko>=0.7.1,<0.8", "posebusters>=0.6.5,<1"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sci_modeling*"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-molecular-modeling-preflight"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pandas>=2.2,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
docking = ["vina>=1.2", "posebusters>=0.4"]
md = ["openmm>=8", "MDAnalysis>=2.8"]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-network-pharmacology"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "rdkit>=2025.3,<2027",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sci_network*"]

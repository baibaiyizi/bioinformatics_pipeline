[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-network-pharmacology"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["networkx>=3.4,<4", "numpy>=2,<3", "pandas>=2.2,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

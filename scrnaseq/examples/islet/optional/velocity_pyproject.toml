[project]
name = "pfos-velocity-counting"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "velocyto==0.17.17",
  "numpy==1.23.5",
  "numba==0.57.1",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "loompy==3.0.8",
  "h5py==3.10.0",
  "pysam==0.23.3",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
velocyto = ["numpy==1.23.5", "Cython<3"]

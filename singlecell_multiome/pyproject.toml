[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-singlecell-multiome"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anndata>=0.12,<0.13",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.7,<1.9",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
multiome = ["mudata>=0.3,<0.4", "scvi-tools>=1.4,<1.6"]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-spatial-metabolomics"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "pyyaml>=6,<7", "scikit-learn>=1.7,<1.9"]

[project.optional-dependencies]
imzml = ["pyimzml>=1.5,<2"]
test = ["pytest>=8,<10"]
